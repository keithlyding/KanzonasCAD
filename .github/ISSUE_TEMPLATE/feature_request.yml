name: Feature request
description: An idea for something new or better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not just the solution. "I draw control panels and need to ..." helps a lot.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could KanzonasCAD help?
      description: How you picture it working. If another program (AutoCAD Electrical, EPLAN, ...) does it well, say how.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
