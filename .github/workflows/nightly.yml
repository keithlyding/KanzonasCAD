name: Nightly tests

# Every night on main (the owner, Nov 2026: "a daily battery of tests to run every night at 12am
# eastern to overcome what we're giving up": main's build skips the tests a pull request's build
# already passed on the same files, tools/already_tested.py, so main gets no seed of its own
# there). The unit tests on Windows and Linux, and the long battery on four seeds new each
# night (the date and the part: 202611241 ... 202611244; run one again with
# python tests/battery.py OUT --ops 3000 --seed N). A failure goes into one open issue labeled
# "nightly"; nothing is changed automatically.
on:
  schedule:
    # (GitHub's schedules are in UTC: 05:00 UTC is midnight EST, 1 a.m. while daylight saving
    # time is on; a schedule can start late when GitHub is busy)
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # (the night's date, once: every battery part and the report use the same one)
  seed:
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.day.outputs.day }}
    steps:
      - id: day
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_tests.py

  linux-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Libraries Qt needs and test tools (as the build's linux job)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libgl1 libopengl0 libdbus-1-3 libfontconfig1 libgtk-3-0 libcups2 \
            xvfb xauth xdotool

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_tests.py

  battery:
    needs: seed
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Libraries Qt needs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libopengl0 libdbus-1-3 libfontconfig1 libxkbcommon0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt

      - name: Long battery (3,000 steps)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          seed=${{ needs.seed.outputs.day }}${{ matrix.part }}
          echo "seed $seed"
          python tests/battery.py battery-out --ops 3000 --seed "$seed"

      - name: Battery log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-battery-log-${{ matrix.part }}
          path: battery-out/battery.log
          if-no-files-found: ignore

  report:
    needs: [seed, windows-tests, linux-tests, battery]
    if: always() && (needs.windows-tests.result == 'failure' || needs.linux-tests.result == 'failure' || needs.battery.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "Nightly tests failed on main (${{ needs.seed.outputs.day }}, commit ${GITHUB_SHA::7})."
            echo
            echo "- Windows unit tests: ${{ needs.windows-tests.result }}"
            echo "- Linux unit tests: ${{ needs.linux-tests.result }}"
            echo "- Long battery, seeds ${{ needs.seed.outputs.day }}1 to ${{ needs.seed.outputs.day }}4: ${{ needs.battery.result }}"
            echo
            echo "The run, with the logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > body.md
          gh label create nightly --color D93F0B --description "Nightly tests failed" 2>/dev/null || true
          n=$(gh issue list --label nightly --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file body.md
          else
            gh issue create --title "Nightly tests failed on main" --label nightly --body-file body.md
          fi
