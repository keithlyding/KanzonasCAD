name: Build Windows and Linux apps

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch cancels the older, still-running build
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # (ezdxf's data only: --collect-all also pulls in what its add-ons can use, pandas,
  # matplotlib, PIL...; the self-test reads and writes DXF inside the built app)
  PYINSTALLER_OPTIONS: >-
    --noconfirm --windowed --collect-data ezdxf --collect-data qtawesome
    --exclude-module tkinter --exclude-module pandas --exclude-module matplotlib
    --exclude-module PIL --exclude-module lxml --exclude-module PySide6.QtDataVisualization
    --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtOpenGLWidgets
    --exclude-module PySide6.QtNetwork --icon assets/kanzonascad.ico --name KanzonasCAD

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller

      - name: Release notes for this version
        run: python tools/check_release_notes.py

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -t .

      - name: Build the app folder
        run: python -m PyInstaller ${{ env.PYINSTALLER_OPTIONS }} run.py

      - name: Smoke test (the exe starts and stays up)
        shell: pwsh
        run: |
          $p = Start-Process dist\KanzonasCAD\KanzonasCAD.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - name: Self test inside the exe
        shell: pwsh
        run: |
          $p = Start-Process dist\KanzonasCAD\KanzonasCAD.exe -ArgumentList "--selftest","selftest.log" -PassThru -Wait
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "Self test failed with code $($p.ExitCode)" }

      - name: License files
        shell: pwsh
        run: |
          Copy-Item LICENSE dist\KanzonasCAD\LICENSE.txt
          Copy-Item NOTICE.md dist\KanzonasCAD\NOTICE.md

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\KanzonasCAD -DestinationPath KanzonasCAD-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KanzonasCAD-windows
          path: KanzonasCAD-windows.zip
          retention-days: 14

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries Qt needs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libgl1 libopengl0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller

      - name: Release notes for this version
        run: python tools/check_release_notes.py

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -t .

      - name: Build the app folder
        run: python -m PyInstaller ${{ env.PYINSTALLER_OPTIONS }} run.py

      - name: Self test inside the built app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          dist/KanzonasCAD/KanzonasCAD --selftest selftest.log
          code=$?
          cat selftest.log
          exit $code

      - name: Archive
        run: |
          cp LICENSE NOTICE.md dist/KanzonasCAD/
          tar -C dist -czf KanzonasCAD-linux.tar.gz KanzonasCAD

      - uses: actions/upload-artifact@v4
        with:
          name: KanzonasCAD-linux
          path: KanzonasCAD-linux.tar.gz
          retention-days: 14
