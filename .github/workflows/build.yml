name: Build Windows and Linux apps

# as KanzonasPDF: every push builds (a branch's run is the check its pull request needs: no
# separate pull-request run), and a push to main builds and then publishes the release
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch cancels the older, still-running build. Not on main: a run
# cancelled while publishing would leave a release half made; main's builds wait their turn.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # (ezdxf's data only: --collect-all also pulls in what its add-ons can use, pandas,
  # matplotlib, PIL...; the self-test reads and writes DXF inside the built app)
  PYINSTALLER_OPTIONS: >-
    --noconfirm --windowed --collect-data ezdxf --collect-data qtawesome --collect-all ezdwg --collect-data kanzonascad
    --exclude-module tkinter --exclude-module pandas --exclude-module matplotlib
    --exclude-module PIL --exclude-module lxml --exclude-module PySide6.QtDataVisualization
    --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtOpenGLWidgets --icon assets/kanzonascad.ico --name KanzonasCAD

jobs:
  # (named build, as in KanzonasPDF: the rule protecting main requires a check called build)
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller

      - name: Release notes for this version
        run: python tools/check_release_notes.py

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -t .

      - name: Build the app folder
        run: python -m PyInstaller ${{ env.PYINSTALLER_OPTIONS }} run.py

      - name: Smoke test (the exe starts and stays up)
        shell: pwsh
        run: |
          $p = Start-Process dist\KanzonasCAD\KanzonasCAD.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - name: Self test inside the exe
        shell: pwsh
        run: |
          $p = Start-Process dist\KanzonasCAD\KanzonasCAD.exe -ArgumentList "--selftest","selftest.log" -PassThru -Wait
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "Self test failed with code $($p.ExitCode)" }

      - name: License files
        shell: pwsh
        run: |
          Copy-Item LICENSE dist\KanzonasCAD\LICENSE.txt
          Copy-Item NOTICE.md dist\KanzonasCAD\NOTICE.md

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\KanzonasCAD -DestinationPath KanzonasCAD-windows.zip

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import kanzonascad; print(kanzonascad.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup isn't available" }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\KanzonasCAD.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          # the same files labeled 0.0 stand in for "the version the user already has"
          & $iscc /DMyAppVersion=0.0 installer\KanzonasCAD.iss
          if ($LASTEXITCODE -ne 0) { throw "Old installer build failed" }

      - name: Test the installer (install, update as Update now does, self test, uninstall)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $dir = "$env:RUNNER_TEMP\kzcadinstall"
          $un = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{3D7B9E24-6A1C-4F85-B2E0-9C4D7A15E863}_is1"
          $p = Start-Process "dist-installer\KanzonasCAD-v0.0-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART","/DIR=$dir","/TASKS=kzcadfiles" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "The old version failed to install (code $($p.ExitCode))" }
          if ((Get-ItemProperty $un).DisplayVersion -ne "0.0") { throw "No uninstall entry for the old version" }
          if ((Get-ItemProperty "Registry::HKEY_CURRENT_USER\Software\Classes\.kzcad")."(default)" -ne "KanzonasCAD.Project") { throw ".kzcad isn't associated" }
          $cmd = (Get-ItemProperty "Registry::HKEY_CURRENT_USER\Software\Classes\KanzonasCAD.Project\shell\open\command")."(default)"
          if ($cmd -notlike "*$dir\KanzonasCAD.exe*%1*") { throw "Wrong open command: $cmd" }
          New-Item -Force "HKCU:\Software\KanzonasCAD\upgradetest" | Set-ItemProperty -Name keep -Value "yes"
          # the old version is running when the update starts
          $old = Start-Process "$dir\KanzonasCAD.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($old.HasExited) { throw "The installed app exited early (code $($old.ExitCode))" }
          # the new setup runs exactly as Update now runs it (updates.installer_command): no /DIR
          # (it finds the installed copy by itself), and /RELAUNCH starts KanzonasCAD again
          $uargs = "/SILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/CLOSEAPPLICATIONS","/CURRENTUSER","/RELAUNCH"
          # (not -Wait: that would also wait for the KanzonasCAD the setup starts)
          $p = Start-Process "dist-installer\KanzonasCAD-v$v-setup.exe" -ArgumentList $uargs -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "The update failed (code $($p.ExitCode))" }
          if (-not $old.HasExited) { $old | Stop-Process -Force; throw "The setup didn't close the running KanzonasCAD" }
          $again = $null
          foreach ($i in 1..60) {
            $again = Get-Process KanzonasCAD -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($dir) }
            if ($again) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $again) { throw "The update didn't start KanzonasCAD again" }
          Start-Sleep -Seconds 3
          $again | Stop-Process -Force
          Start-Sleep -Seconds 2
          if ((Get-ItemProperty $un).DisplayVersion -ne $v) { throw "Installed version is '$((Get-ItemProperty $un).DisplayVersion)' after the update" }
          if ((Get-ItemProperty $un).InstallLocation.TrimEnd('\') -ne $dir) { throw "The update installed to a different folder" }
          if ((Get-ItemProperty "HKCU:\Software\KanzonasCAD\upgradetest").keep -ne "yes") { throw "The update lost the user's settings" }
          python -c "import sys; from kanzonascad import updates; sys.exit(1 if updates.for_all_users(sys.argv[1]) else 0)" $dir
          if ($LASTEXITCODE -ne 0) { throw "The updater takes this per-user copy for an all-users one" }
          $p = Start-Process "$dir\KanzonasCAD.exe" -ArgumentList "--selftest","installed-selftest.log" -PassThru -Wait
          Get-Content installed-selftest.log
          if ($p.ExitCode -ne 0) { throw "The installed app failed its self test" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\KanzonasCAD.exe") { throw "Uninstall left the app behind" }
          if (Test-Path "Registry::HKEY_CURRENT_USER\Software\Classes\KanzonasCAD.Project") { throw "Uninstall left the .kzcad association behind" }
          Remove-Item -Recurse -Force "HKCU:\Software\KanzonasCAD\upgradetest" -ErrorAction SilentlyContinue
          Write-Host "Installed 0.0, updated to $v in place (settings kept, restarted), uninstalled"

      - name: Test the installer for all users (install, update as Update now does, uninstall)
        timeout-minutes: 10
        shell: pwsh
        run: |
          # (the build machine runs as administrator: no prompt; on a PC, Windows asks)
          $v = "${{ steps.ver.outputs.version }}"
          $un = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{3D7B9E24-6A1C-4F85-B2E0-9C4D7A15E863}_is1"
          $p = Start-Process "dist-installer\KanzonasCAD-v0.0-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/ALLUSERS","/NORESTART","/TASKS=kzcadfiles" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "The all-users install failed (code $($p.ExitCode))" }
          $dir = (Get-ItemProperty $un).InstallLocation.TrimEnd('\')
          if (-not $dir.StartsWith($env:ProgramFiles)) { throw "All-users install went to '$dir'" }
          if (-not (Test-Path "Registry::HKEY_LOCAL_MACHINE\Software\Classes\KanzonasCAD.Project\shell\open\command")) { throw ".kzcad isn't associated for all users" }
          python -c "import sys; from kanzonascad import updates; c = updates.installer_command('s.exe', sys.argv[1]); print(c); sys.exit(0 if '/ALLUSERS' in c else 1)" $dir
          if ($LASTEXITCODE -ne 0) { throw "The updater doesn't see the all-users install" }
          $uargs = "/SILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/CLOSEAPPLICATIONS","/ALLUSERS","/RELAUNCH"
          $p = Start-Process "dist-installer\KanzonasCAD-v$v-setup.exe" -ArgumentList $uargs -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "The all-users update failed (code $($p.ExitCode))" }
          foreach ($i in 1..30) {
            $again = Get-Process KanzonasCAD -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($dir) }
            if ($again) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $again) { throw "The all-users update didn't start KanzonasCAD again" }
          $again | Stop-Process -Force
          Start-Sleep -Seconds 2
          if ((Get-ItemProperty $un).DisplayVersion -ne $v) { throw "All-users version is '$((Get-ItemProperty $un).DisplayVersion)' after the update" }
          if ((Get-ItemProperty $un).InstallLocation.TrimEnd('\') -ne $dir) { throw "The all-users update went to a different folder" }
          $cu = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{3D7B9E24-6A1C-4F85-B2E0-9C4D7A15E863}_is1"
          if (Test-Path $cu) { throw "The all-users update also installed a per-user copy" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\KanzonasCAD.exe") { throw "Uninstall left the all-users app behind" }
          Write-Host "All users: installed 0.0, updated to $v in place, restarted, uninstalled"

      - name: Portable version (settings, library and recovery in a data folder beside the exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item -Recurse dist\KanzonasCAD portable\KanzonasCAD
          @"
          KanzonasCAD portable

          Because this file is here, KanzonasCAD keeps its settings, your library (symbols,
          footprints, parts, templates) and its recovery copies in the "data" folder next to
          KanzonasCAD.exe instead of the computer's registry and user folders. Copy the whole
          KanzonasCAD folder anywhere (a USB stick, a network drive) and run KanzonasCAD.exe.
          No installation or Python needed. Delete this file to make it behave like the
          installed version.
          "@ | Set-Content portable\KanzonasCAD\portable.txt
          Compress-Archive -Path portable\KanzonasCAD -DestinationPath KanzonasCAD-portable.zip
          # test a copy: it must run, keep its settings in data\ and leave the registry alone
          Remove-Item -Recurse -Force "HKCU:\Software\KanzonasCAD" -ErrorAction SilentlyContinue
          Copy-Item -Recurse portable\KanzonasCAD "$env:RUNNER_TEMP\kzcadportable"
          $p = Start-Process "$env:RUNNER_TEMP\kzcadportable\KanzonasCAD.exe" -ArgumentList "--selftest","portable-selftest.log" -PassThru -Wait
          Get-Content portable-selftest.log
          if ($p.ExitCode -ne 0) { throw "Portable app failed its self test" }
          if (-not (Select-String -Path portable-selftest.log -Pattern "PASS  storage location.*portable" -Quiet)) { throw "The self test didn't run as portable" }
          if (-not (Test-Path "$env:RUNNER_TEMP\kzcadportable\data\settings.ini")) { throw "Portable settings not in the data folder" }
          if (Test-Path "HKCU:\Software\KanzonasCAD") { throw "Portable app wrote to the registry" }

      - name: PortableApps.com package layout (finished by hand with their tools; docs/portableapps.md)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/make_portableapps.py "${{ steps.ver.outputs.version }}" dist\KanzonasCAD KanzonasCADPortable
          if ($LASTEXITCODE -ne 0) { throw "Making the PortableApps.com layout failed" }
          # the program in the package keeps its data in the package's Data folder, leaves the
          # registry alone and doesn't offer to update itself
          Remove-Item -Recurse -Force "HKCU:\Software\KanzonasCAD" -ErrorAction SilentlyContinue
          $p = Start-Process "KanzonasCADPortable\App\KanzonasCAD\KanzonasCAD.exe" -ArgumentList "--selftest","paf-selftest.log" -PassThru -Wait
          Get-Content paf-selftest.log
          if ($p.ExitCode -ne 0) { throw "PortableApps.com package failed its self test" }
          if (-not (Select-String -Path paf-selftest.log -Pattern "PASS  storage location.*updated by its platform" -Quiet)) { throw "The package's program doesn't leave updates to the platform" }
          if (-not (Test-Path "KanzonasCADPortable\Data\settings.ini")) { throw "Settings not in the package's Data folder" }
          if (Test-Path "HKCU:\Software\KanzonasCAD") { throw "PortableApps.com package wrote to the registry" }
          Remove-Item -Recurse -Force "KanzonasCADPortable\Data"
          # uploaded as a folder (GitHub zips each artifact once); the paf folder keeps
          # KanzonasCADPortable as the top folder in the download
          New-Item -ItemType Directory paf | Out-Null
          Move-Item KanzonasCADPortable paf\KanzonasCADPortable

      - uses: actions/upload-artifact@v4
        with:
          name: KanzonasCAD-windows
          path: KanzonasCAD-windows.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: KanzonasCAD-portable
          path: KanzonasCAD-portable.zip
          retention-days: 14

      # (a build artifact only, not a release download, as KanzonasPDF's)
      - uses: actions/upload-artifact@v4
        with:
          name: KanzonasCAD-v${{ steps.ver.outputs.version }}-portableapps-layout
          path: paf/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: KanzonasCAD-setup
          path: dist-installer/KanzonasCAD-v${{ steps.ver.outputs.version }}-setup.exe
          retention-days: 14

  # Linux: the app folder (tar.gz) and an AppImage (x86_64) made from it, as KanzonasPDF's.
  # Built on the oldest Ubuntu it supports, so it runs on glibc 2.35 and newer (Ubuntu 22.04,
  # Debian 12, Fedora 36 and later); PySide6 6.12's wheels need glibc 2.34.
  # packaging/linux/make_appimage.py makes the AppDir and checks it.
  linux:
    runs-on: ubuntu-22.04
    env:
      # appimagetool pinned to an exact release file and checked against its SHA-256. The
      # AppImage runtime (the small program at the start of every AppImage) is the one at the
      # start of appimagetool itself (an AppImage too): its first APPIMAGE_RUNTIME_BYTES
      # bytes, checked against their own SHA-256, so it is pinned with appimagetool instead
      # of appimagetool fetching the unpinned "continuous" runtime. (The same pins as
      # KanzonasPDF's build: update both together.)
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
      APPIMAGE_RUNTIME_BYTES: "692512"
      APPIMAGE_RUNTIME_SHA256: 33a0fb9c4e2477d0cf1994a179e983633f3b3e77876b190bacff32f335551091
      # the oldest system supported (Ubuntu 22.04's glibc, and GCC 12's libstdc++ with its
      # C++ ABI and libgcc_s): the build fails if a bundled file needs newer ones (the build
      # machine's own libstdc++ may be newer, so its self test alone wouldn't show it)
      MAX_GLIBC: "2.35"
      MAX_GLIBCXX: "3.4.30"
      MAX_CXXABI: "1.3.13"
      MAX_LIBGCC: "12.0.0"
      # an AppImage much bigger than this means something unexpected got bundled
      MAX_APPIMAGE_MB: "400"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries (bundled into the AppImage) and test tools
        run: |
          # Qt's X11 platform needs the xcb libraries (not on every desktop: they go into the
          # AppImage); Xvfb and xdotool run the tests; appstream and desktop-file-utils check
          # the metadata
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libgl1 libopengl0 libdbus-1-3 libfontconfig1 libgtk-3-0 libcups2 \
            xvfb xauth xdotool appstream desktop-file-utils

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller

      - name: Release notes for this version
        run: python tools/check_release_notes.py

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -t .

      # The battery, longer than the unit tests' short run, with a new seed every build (the
      # run number), so each build tries different random editing; a failure names its seed
      # (run it again with: python tests/battery.py OUT --ops 1000 --seed N)
      - name: Battery (random editing, every command, files, speed)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/battery.py battery-out --ops 1000 --seed ${{ github.run_number }}

      - name: Battery log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-log
          path: battery-out/battery.log
          if-no-files-found: ignore

      - name: Build the app folder
        run: python -m PyInstaller ${{ env.PYINSTALLER_OPTIONS }} --runtime-hook packaging/linux/pyi_rth_linux_env.py run.py

      - name: Self test inside the built app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          dist/KanzonasCAD/KanzonasCAD --selftest selftest.log
          code=$?
          cat selftest.log
          exit $code

      - name: License files
        run: cp LICENSE dist/KanzonasCAD/LICENSE.txt && cp NOTICE.md dist/KanzonasCAD/NOTICE.md

      - name: Archive
        run: tar -C dist -czf KanzonasCAD-linux.tar.gz KanzonasCAD

      - name: Version
        id: ver
        run: echo "version=$(python -c 'import kanzonascad; print(kanzonascad.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Fetch appimagetool and the AppImage runtime (pinned, checked)
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          fetch() {   # url, expected sha256, file
            if ! [[ "$2" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::No SHA-256 pinned for $1 (set it in the linux job's env)"
              curl -fsSL --retry 3 -o "$3" "$1" && echo "That file's SHA-256 is $(sha256sum "$3" | cut -d' ' -f1): check it on the release page before pinning it."
              exit 1
            fi
            curl -fsSL --retry 3 -o "$3" "$1"
            got=$(sha256sum "$3" | cut -d' ' -f1)
            if [ "$got" != "$2" ]; then
              echo "::error::$1 has SHA-256 $got, not the pinned $2"
              exit 1
            fi
          }
          fetch "$APPIMAGETOOL_URL" "$APPIMAGETOOL_SHA256" "$RUNNER_TEMP/tools/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/tools/appimagetool-x86_64.AppImage"
          # the runtime: the start of appimagetool (a type 2 AppImage: "AI\x02" at byte 8)
          head -c "$APPIMAGE_RUNTIME_BYTES" "$RUNNER_TEMP/tools/appimagetool-x86_64.AppImage" > "$RUNNER_TEMP/tools/runtime-x86_64"
          got=$(sha256sum "$RUNNER_TEMP/tools/runtime-x86_64" | cut -d' ' -f1)
          if [ "$got" != "$APPIMAGE_RUNTIME_SHA256" ]; then
            echo "::error::the runtime cut from appimagetool has SHA-256 $got, not the pinned $APPIMAGE_RUNTIME_SHA256"
            exit 1
          fi
          python - "$RUNNER_TEMP/tools/runtime-x86_64" <<'PY'
          import sys
          d = open(sys.argv[1], "rb").read(16)
          assert d[:4] == b"\x7fELF" and d[8:11] == b"AI\x02", "not a type 2 AppImage runtime"
          PY

      - name: Make the AppImage (AppDir, excluded libraries, compatibility checks)
        run: |
          python packaging/linux/make_appimage.py dist/KanzonasCAD AppDir \
            --version "${{ steps.ver.outputs.version }}" \
            --max-glibc "$MAX_GLIBC" --max-glibcxx "$MAX_GLIBCXX" \
            --max-cxxabi "$MAX_CXXABI" --max-libgcc "$MAX_LIBGCC" \
            --appimagetool "$RUNNER_TEMP/tools/appimagetool-x86_64.AppImage" \
            --runtime-file "$RUNNER_TEMP/tools/runtime-x86_64" \
            --output KanzonasCAD-x86_64.AppImage

      - name: Check the AppImage (size, contents)
        run: |
          size=$(stat -c %s KanzonasCAD-x86_64.AppImage)
          echo "KanzonasCAD-x86_64.AppImage: $((size / 1000000)) MB"
          if [ "$size" -gt $((MAX_APPIMAGE_MB * 1000000)) ]; then
            echo "::error::The AppImage is bigger than $MAX_APPIMAGE_MB MB"; exit 1
          fi
          # what's really inside (not just the AppDir it was made from)
          rm -rf squashfs-root
          ./KanzonasCAD-x86_64.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/kanzonascad.desktop
          test -f squashfs-root/usr/share/metainfo/io.github.keithlyding.kanzonascad.metainfo.xml
          test -f squashfs-root/usr/lib/KanzonasCAD/LICENSE.txt
          test -f squashfs-root/usr/lib/KanzonasCAD/NOTICE.md
          bad=$(grep -v '^\s*\(#\|$\)' packaging/linux/excludelist | while read -r lib; do
                  find squashfs-root -name "$lib" -type f; done)
          if [ -n "$bad" ]; then echo "::error::Libraries the computer provides are bundled: $bad"; exit 1; fi
          rm -rf squashfs-root

      - name: Self test (inside the AppImage, on an X display)
        run: |
          # no FUSE on the build machines: the AppImage unpacks itself and runs
          code=0
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            ./KanzonasCAD-x86_64.AppImage --appimage-extract-and-run --selftest selftest-linux.log || code=$?
          cat selftest-linux.log
          if [ $code -ne 0 ]; then echo "::error::Self test failed with code $code"; exit 1; fi
          if grep -q '^FAIL' selftest-linux.log; then echo "::error::Self test has failures"; exit 1; fi
          grep -q '^PASS  speed budget' selftest-linux.log

      - name: Smoke test (the AppImage starts and opens a project)
        run: packaging/linux/smoke_test.sh ./KanzonasCAD-x86_64.AppImage --appimage-extract-and-run

      - uses: actions/upload-artifact@v4
        with:
          name: KanzonasCAD-linux
          path: KanzonasCAD-linux.tar.gz
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: KanzonasCAD-appimage
          path: KanzonasCAD-x86_64.AppImage
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-selftest-log
          path: selftest*.log
          if-no-files-found: ignore

  # A release for each new version that reaches main: only after both builds are green, and
  # only once per version (a merge that didn't change __version__ publishes nothing).
  publish:
    needs: [build, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Version and whether it is already released
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import kanzonascad; print(kanzonascad.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "v$v is already released: nothing to publish"
            echo "exists=yes" >> "$GITHUB_OUTPUT"
          else
            echo "exists=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.exists == 'no'
        with:
          path: artifacts

      - name: Release notes for this version
        if: steps.ver.outputs.exists == 'no'
        run: |
          v="${{ steps.ver.outputs.version }}"
          awk -v head="## $v" '
            $0 == head { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' RELEASE_NOTES.md > section.md
          if [ ! -s section.md ]; then echo "RELEASE_NOTES.md has no '## $v' section"; exit 1; fi
          # (between these marks, the app's update box shows the notes: updates.release_notes)
          { echo "<!-- kanzonascad-notes -->"; cat section.md; echo "<!-- /kanzonascad-notes -->"; } > notes.md
          printf '\n---\n**Windows:** download `KanzonasCAD-v%s-setup.exe` and run it (no administrator rights needed; Windows may warn about an unknown publisher: More info > Run anyway). Or, without installing, `KanzonasCAD-v%s-windows.zip`: unzip it and run `KanzonasCAD\\KanzonasCAD.exe`.\n**Portable (no install; settings and library stay with the app):** `KanzonasCAD-v%s-portable.zip`: unzip it anywhere (a USB stick) and run `KanzonasCAD\\KanzonasCAD.exe`; your settings, library and recovery copies stay in its `data` folder. To update, use Update now, or unzip the new one over the same folder (the `data` folder is kept).\n**Linux (64-bit PC; Ubuntu 22.04, Debian 12, Fedora 36 or newer):** download `KanzonasCAD-x86_64.AppImage`, make it executable (`chmod +x KanzonasCAD-x86_64.AppImage`, or Properties > Allow executing) and run it; it updates itself (Update now). Or `KanzonasCAD-v%s-linux.tar.gz`: unpack it and run `KanzonasCAD/KanzonasCAD`.\nOr run it from source: see the README.\n' "$v" "$v" "$v" "$v" >> notes.md
          cat notes.md

      - name: Publish
        if: steps.ver.outputs.exists == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          mv artifacts/KanzonasCAD-windows/KanzonasCAD-windows.zip "KanzonasCAD-v$v-windows.zip"
          mv artifacts/KanzonasCAD-linux/KanzonasCAD-linux.tar.gz "KanzonasCAD-v$v-linux.tar.gz"
          mv "artifacts/KanzonasCAD-setup/KanzonasCAD-v$v-setup.exe" .
          mv artifacts/KanzonasCAD-portable/KanzonasCAD-portable.zip "KanzonasCAD-v$v-portable.zip"
          # (the same name for every version, as KanzonasPDF's: it updates itself in place)
          mv artifacts/KanzonasCAD-appimage/KanzonasCAD-x86_64.AppImage KanzonasCAD-x86_64.AppImage
          chmod +x KanzonasCAD-x86_64.AppImage
          # the SHA-256 of every download (as KanzonasPDF's): in SHA256SUMS.txt and in the notes,
          # so anyone can check that what they downloaded is what was built here
          sha256sum "KanzonasCAD-v$v-setup.exe" "KanzonasCAD-v$v-windows.zip" \
            "KanzonasCAD-v$v-portable.zip" "KanzonasCAD-x86_64.AppImage" \
            "KanzonasCAD-v$v-linux.tar.gz" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          { printf '\n**SHA-256 checksums** (also in `SHA256SUMS.txt`):\n```\n'; cat SHA256SUMS.txt; printf '```\n'; } >> notes.md
          gh release create "v$v" "KanzonasCAD-v$v-setup.exe" "KanzonasCAD-v$v-windows.zip" \
            "KanzonasCAD-v$v-portable.zip" "KanzonasCAD-x86_64.AppImage" "KanzonasCAD-v$v-linux.tar.gz" \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "KanzonasCAD $v" --notes-file notes.md --latest
