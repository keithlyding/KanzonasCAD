name: Build Windows and Linux apps

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch cancels the older, still-running build. Not on main: a run
# cancelled while publishing would leave a release half made; main's builds wait their turn.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # (ezdxf's data only: --collect-all also pulls in what its add-ons can use, pandas,
  # matplotlib, PIL...; the self-test reads and writes DXF inside the built app)
  PYINSTALLER_OPTIONS: >-
    --noconfirm --windowed --collect-data ezdxf --collect-data qtawesome
    --exclude-module tkinter --exclude-module pandas --exclude-module matplotlib
    --exclude-module PIL --exclude-module lxml --exclude-module PySide6.QtDataVisualization
    --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtOpenGLWidgets
    --exclude-module PySide6.QtNetwork --icon assets/kanzonascad.ico --name KanzonasCAD

jobs:
  # (named build, as in KanzonasPDF: the rule protecting main requires a check called build)
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller

      - name: Release notes for this version
        run: python tools/check_release_notes.py

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -t .

      - name: Build the app folder
        run: python -m PyInstaller ${{ env.PYINSTALLER_OPTIONS }} run.py

      - name: Smoke test (the exe starts and stays up)
        shell: pwsh
        run: |
          $p = Start-Process dist\KanzonasCAD\KanzonasCAD.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - name: Self test inside the exe
        shell: pwsh
        run: |
          $p = Start-Process dist\KanzonasCAD\KanzonasCAD.exe -ArgumentList "--selftest","selftest.log" -PassThru -Wait
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "Self test failed with code $($p.ExitCode)" }

      - name: License files
        shell: pwsh
        run: |
          Copy-Item LICENSE dist\KanzonasCAD\LICENSE.txt
          Copy-Item NOTICE.md dist\KanzonasCAD\NOTICE.md

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\KanzonasCAD -DestinationPath KanzonasCAD-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KanzonasCAD-windows
          path: KanzonasCAD-windows.zip
          retention-days: 14

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries Qt needs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libgl1 libopengl0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller

      - name: Release notes for this version
        run: python tools/check_release_notes.py

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -t .

      - name: Build the app folder
        run: python -m PyInstaller ${{ env.PYINSTALLER_OPTIONS }} run.py

      - name: Self test inside the built app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          dist/KanzonasCAD/KanzonasCAD --selftest selftest.log
          code=$?
          cat selftest.log
          exit $code

      - name: Archive
        run: |
          cp LICENSE NOTICE.md dist/KanzonasCAD/
          tar -C dist -czf KanzonasCAD-linux.tar.gz KanzonasCAD

      - uses: actions/upload-artifact@v4
        with:
          name: KanzonasCAD-linux
          path: KanzonasCAD-linux.tar.gz
          retention-days: 14

  # A release for each new version that reaches main: only after both builds are green, and
  # only once per version (a merge that didn't change __version__ publishes nothing).
  publish:
    needs: [build, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Version and whether it is already released
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import kanzonascad; print(kanzonascad.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "v$v is already released: nothing to publish"
            echo "exists=yes" >> "$GITHUB_OUTPUT"
          else
            echo "exists=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.exists == 'no'
        with:
          path: artifacts

      - name: Release notes for this version
        if: steps.ver.outputs.exists == 'no'
        run: |
          v="${{ steps.ver.outputs.version }}"
          awk -v head="## $v" '
            $0 == head { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' RELEASE_NOTES.md > notes.md
          if [ ! -s notes.md ]; then echo "RELEASE_NOTES.md has no '## $v' section"; exit 1; fi
          printf '\n---\n**Windows:** download `KanzonasCAD-v%s-windows.zip`, unzip it and run `KanzonasCAD\\KanzonasCAD.exe` (Windows may warn about an unknown publisher: More info > Run anyway).\n**Linux:** `KanzonasCAD-v%s-linux.tar.gz`, unpack it and run `KanzonasCAD/KanzonasCAD`.\nOr run it from source: see the README.\n' "$v" "$v" >> notes.md
          cat notes.md

      - name: Publish
        if: steps.ver.outputs.exists == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          mv artifacts/KanzonasCAD-windows/KanzonasCAD-windows.zip "KanzonasCAD-v$v-windows.zip"
          mv artifacts/KanzonasCAD-linux/KanzonasCAD-linux.tar.gz "KanzonasCAD-v$v-linux.tar.gz"
          # 0.x versions are marked pre-release until the owner calls KanzonasCAD ready
          pre=""
          case "$v" in 0.*) pre="--prerelease" ;; esac
          gh release create "v$v" "KanzonasCAD-v$v-windows.zip" "KanzonasCAD-v$v-linux.tar.gz" \
            --target "$GITHUB_SHA" --title "KanzonasCAD $v" --notes-file notes.md $pre
